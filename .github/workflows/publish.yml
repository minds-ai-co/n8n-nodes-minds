name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Require a release tag matching the package
        run: |
          node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF !== `refs/tags/v${p.version}`) throw new Error("Publish must run on the matching release tag")'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Publish with provenance
        # npm prefers trusted publishing (GitHub OIDC) and falls back to the
        # package-scoped token until the trusted publisher is configured.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check published package
        run: |
          result=$(npx --yes @n8n/scan-community-package@0.32.0 n8n-nodes-minds)
          printf '%s\n' "$result"
          printf '%s\n' "$result" | grep -q 'passed security checks'
